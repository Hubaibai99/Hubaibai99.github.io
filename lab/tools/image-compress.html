<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>图片压缩</title>
<meta name="description" content="本地图片压缩与放大：Canvas 在浏览器内处理，可按质量或目标大小（KB/MB/GB）输出；「只补体积」不动画面也能填到目标，支持 JPG/PNG/WebP，不上传服务器。" />
<style>
  :root {
    --bg: #101418;
    --surface: #171c21;
    --surface-2: #1e242b;
    --text: #e8edf2;
    --muted: #8b96a3;
    --line: #2a323a;
    --accent: #7c9efc;
    --accent-soft: rgba(124, 158, 252, 0.14);
    --ok: #5ecf9a;
    --warn: #e2b04a;
    --danger: #e07a7a;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 20px 14px 40px;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
  }
  .app {
    width: min(560px, 100%);
    display: grid;
    gap: 14px;
    align-content: start;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  header.card {
    padding: 18px 16px 14px;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }
  h1 { font-size: 18px; font-weight: 650; letter-spacing: 0.02em; }
  .sub { width: 100%; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .tag {
    font-size: 11px;
    color: var(--ok);
    border: 1px solid rgba(94, 207, 154, 0.35);
    background: rgba(94, 207, 154, 0.08);
    padding: 3px 8px;
    border-radius: 999px;
  }

  .drop {
    margin: 0 16px 16px;
    border: 1.5px dashed var(--line);
    border-radius: var(--radius);
    background: var(--surface-2);
    padding: 28px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .drop:hover, .drop:focus-visible {
    border-color: var(--accent);
    background: var(--accent-soft);
    outline: none;
  }
  .drop.dragover {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .drop strong {
    display: block;
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .drop span { font-size: 12px; color: var(--muted); }
  .drop input { display: none; }

  .body { padding: 0 16px 16px; display: grid; gap: 14px; }

  .controls {
    display: grid;
    gap: 12px;
    padding: 12px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }
  .controls[hidden],
  #qualityRow[hidden],
  #targetRow[hidden],
  #pngNote[hidden],
  #stats[hidden] {
    display: none !important;
  }
  .ctl {
    display: grid;
    grid-template-columns: 88px 1fr 56px;
    gap: 10px;
    align-items: center;
  }
  .ctl label { font-size: 13px; color: var(--muted); }
  .ctl .val {
    font-family: var(--mono);
    font-size: 12px;
    text-align: right;
    color: var(--text);
  }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--surface);
    box-shadow: 0 0 0 1px var(--accent);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--surface);
    cursor: pointer;
  }
  input[type="range"]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 4px;
  }

  .fmt-row, .mode-row, .size-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .fmt-row .lbl, .mode-row .lbl, .size-row .lbl {
    font-size: 13px;
    color: var(--muted);
    width: 88px;
    flex-shrink: 0;
  }
  .seg {
    display: inline-flex;
    padding: 3px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    gap: 2px;
    flex-wrap: wrap;
  }
  .seg button {
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 500;
    min-height: 34px;
    padding: 0 12px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  .seg button[aria-pressed="true"] {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }
  .seg button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 0;
  }

  .dim-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 8px;
    align-items: center;
  }
  .dim-row input[type="number"] {
    width: 100%;
    min-height: 44px;
    padding: 8px 10px;
    font-family: var(--mono);
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    outline: none;
  }
  .dim-row input[type="number"]:focus-visible {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .dim-row .x { color: var(--muted); font-size: 13px; }
  .lock-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
    min-height: 44px;
  }
  .lock-wrap input {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
  }

  .kb-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 10px;
    align-items: center;
  }
  .kb-row input[type="number"] {
    width: 110px;
    min-height: 44px;
    padding: 8px 10px;
    font-family: var(--mono);
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    outline: none;
  }
  .kb-row input[type="number"]:focus-visible {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .kb-row .hint { font-size: 12px; color: var(--muted); width: 100%; }

  .note {
    font-size: 12px;
    color: var(--warn);
    line-height: 1.4;
  }

  .actions {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
  }
  button {
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    min-height: 44px;
    padding: 0 16px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--text);
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #0c1018;
    font-weight: 600;
  }
  button.primary:hover:not(:disabled) { filter: brightness(1.06); }
  button.ghost {
    background: transparent;
    color: var(--muted);
    min-height: 40px;
    font-size: 13px;
    padding: 0 12px;
  }
  button.ghost:hover:not(:disabled) { color: var(--text); }

  .preview-wrap {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .preview {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    display: grid;
    grid-template-rows: 1fr auto;
  }
  .preview .thumb {
    aspect-ratio: 4 / 3;
    display: grid;
    place-items: center;
    background:
      linear-gradient(45deg, #1a2026 25%, transparent 25%),
      linear-gradient(-45deg, #1a2026 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #1a2026 75%),
      linear-gradient(-45deg, transparent 75%, #1a2026 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0;
    background-color: #14191e;
    min-height: 120px;
  }
  .preview img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    display: block;
  }
  .preview .meta {
    padding: 10px 12px;
    display: grid;
    gap: 2px;
    border-top: 1px solid var(--line);
  }
  .preview .meta .name {
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .preview .meta .info {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }
  .preview .empty {
    font-size: 12px;
    color: var(--muted);
    padding: 20px;
  }

  .stat {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .stat-item {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .stat-item .k { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .stat-item .v {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 600;
  }
  .stat-item .v.good { color: var(--ok); }
  .stat-item .v.bad { color: var(--warn); }

  .status { font-size: 13px; color: var(--muted); min-height: 1.4em; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--danger); }
  .status.warn { color: var(--warn); }

  footer {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    padding: 0 8px;
  }

  @media (max-width: 480px) {
    .fmt-row .lbl, .mode-row .lbl, .size-row .lbl { width: 100%; }
    .preview-wrap { grid-template-columns: 1fr; }
    .stat { grid-template-columns: 1fr; }
    .actions { grid-template-columns: 1fr; }
    button, .drop { min-height: 48px; }
    .ctl { grid-template-columns: 72px 1fr 52px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <div class="app">
    <header class="card">
      <div>
        <h1>图片压缩</h1>
        <p class="sub">Canvas 本地处理 · 可按质量或目标大小 · 支持放大 · 不上传服务器</p>
      </div>
      <span class="tag">仅本地处理</span>
    </header>

    <div class="card">
      <div class="drop" id="drop" tabindex="0" role="button" aria-label="选择或拖入图片">
        <strong>点击选择，或拖入图片</strong>
        <span>支持 JPG、PNG、WebP 等浏览器可解码格式</span>
        <input type="file" id="file" accept="image/*" multiple />
      </div>

      <div class="body">
        <div class="controls" id="controls">
          <div class="mode-row">
            <span class="lbl">输出方式</span>
            <div class="seg" role="group" aria-label="输出方式">
              <button type="button" data-mode="quality" aria-pressed="true">按质量</button>
              <button type="button" data-mode="target" aria-pressed="false">按目标大小</button>
            </div>
          </div>

          <div class="size-row">
            <span class="lbl">输出尺寸</span>
            <div class="dim-row" style="flex:1; min-width:200px;">
              <input type="number" id="outW" min="1" max="8192" step="1" value="1920" aria-label="输出宽度（像素）" />
              <span class="x">×</span>
              <input type="number" id="outH" min="1" max="8192" step="1" value="1080" aria-label="输出高度（像素）" />
            </div>
            <label class="lock-wrap">
              <input type="checkbox" id="lockAspect" checked />
              锁定比例
            </label>
          </div>
          <p class="note" id="dimHint">可大于原图实现放大；设回原尺寸则不缩放。</p>

          <div class="fmt-row">
            <span class="lbl">输出格式</span>
            <div class="seg" role="group" aria-label="输出格式">
              <button type="button" data-fmt="image/jpeg" aria-pressed="true">JPG</button>
              <button type="button" data-fmt="image/webp" aria-pressed="false">WebP</button>
              <button type="button" data-fmt="image/png" aria-pressed="false">PNG</button>
            </div>
          </div>

          <div class="ctl" id="qualityRow">
            <label for="quality">质量</label>
            <input type="range" id="quality" min="10" max="100" value="75" />
            <span class="val" id="qualityVal">75%</span>
          </div>

          <div id="targetRow" hidden>
            <div class="kb-row">
              <span class="lbl">目标大小</span>
              <input type="number" id="targetValue" min="0.1" max="10485760" step="10" value="500" aria-label="目标文件大小数值" />
              <div class="seg" role="group" aria-label="目标大小单位">
                <button type="button" data-unit="KB" aria-pressed="true">KB</button>
                <button type="button" data-unit="MB" aria-pressed="false">MB</button>
                <button type="button" data-unit="GB" aria-pressed="false">GB</button>
              </div>
            </div>
            <div class="fmt-row" style="margin-top:10px;">
              <span class="lbl">策略</span>
              <div class="seg" role="group" aria-label="目标策略">
                <button type="button" data-strategy="fit" aria-pressed="true">调质量/尺寸</button>
                <button type="button" data-strategy="pad" aria-pressed="false">只补体积</button>
              </div>
            </div>
            <span class="hint" style="margin-top:6px;display:block;">
              「只补体积」：画面尺寸尽量不动，不够大时用元数据填充到目标，适合过上传门槛。
            </span>
          </div>

          <p class="note" id="pngNote" hidden>PNG 不受质量影响：按目标大小时只会调整输出尺寸。</p>

          <div class="actions">
            <button type="button" class="primary" id="compress" disabled>导出</button>
            <button type="button" class="ghost" id="reset" disabled>清空</button>
          </div>
        </div>

        <div class="preview-wrap" id="previews">
          <div class="preview" id="previewOrig">
            <div class="thumb"><span class="empty">原图</span></div>
            <div class="meta">
              <div class="name">—</div>
              <div class="info">—</div>
            </div>
          </div>
          <div class="preview" id="previewOut">
            <div class="thumb"><span class="empty">输出</span></div>
            <div class="meta">
              <div class="name">—</div>
              <div class="info">—</div>
            </div>
          </div>
        </div>

        <div class="stat" id="stats" hidden>
          <div class="stat-item">
            <div class="k">原始大小</div>
            <div class="v" id="statOrig">—</div>
          </div>
          <div class="stat-item">
            <div class="k">输出大小</div>
            <div class="v" id="statOut">—</div>
          </div>
          <div class="stat-item">
            <div class="k">变化</div>
            <div class="v" id="statSave">—</div>
          </div>
        </div>

        <p class="status" id="status">先选一张图，再调尺寸 / 质量；支持放大与按目标大小。</p>
      </div>
    </div>

    <footer>处理全部在本机浏览器完成，文件不会离开这台设备。</footer>
  </div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const fileInput = $("file");
  const drop = $("drop");
  const controls = $("controls");
  const compressBtn = $("compress");
  const resetBtn = $("reset");
  const statusEl = $("status");
  const quality = $("quality");
  const qualityVal = $("qualityVal");
  const qualityRow = $("qualityRow");
  const targetRow = $("targetRow");
  const targetValue = $("targetValue");
  const outW = $("outW");
  const outH = $("outH");
  const lockAspect = $("lockAspect");
  const pngNote = $("pngNote");
  const dimHint = $("dimHint");
  const stats = $("stats");
  const statOrig = $("statOrig");
  const statOut = $("statOut");
  const statSave = $("statSave");
  const previewOrig = $("previewOrig");
  const previewOut = $("previewOut");

  let fmt = "image/jpeg";
  let mode = "quality";
  let srcFile = null;
  let srcBitmap = null;
  let srcW = 0;
  let srcH = 0;
  let outBlob = null;
  let outUrl = null;
  let srcUrl = null;
  let busy = false;
  let debounceTimer = null;
  let ignoreDimInput = false;
  let lastResult = null;
  let sizeUnit = "KB";
  let targetStrategy = "fit";

  const extByMime = {
    "image/jpeg": "jpg",
    "image/jpg": "jpg",
    "image/png": "png",
    "image/webp": "webp",
  };
  const MAX_DIM = 8192;

  function setStatus(msg, kind) {
    statusEl.textContent = msg;
    statusEl.className = "status" + (kind ? " " + kind : "");
  }

  function formatBytes(n) {
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
    if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(2) + " MB";
    return (n / 1024 / 1024 / 1024).toFixed(3) + " GB";
  }

  function unitToBytes(unit) {
    if (unit === "GB") return 1024 * 1024 * 1024;
    if (unit === "MB") return 1024 * 1024;
    return 1024;
  }

  function setUnit(next) {
    // Keep the same target size when switching units
    const prevUnit = sizeUnit;
    const prevVal = Number(targetValue.value);
    let bytes = null;
    if (Number.isFinite(prevVal) && prevVal > 0) {
      bytes = prevVal * unitToBytes(prevUnit);
    }
    sizeUnit = next;
    document.querySelectorAll("[data-unit]").forEach((btn) => {
      btn.setAttribute("aria-pressed", String(btn.getAttribute("data-unit") === next));
    });
    const maxMap = { KB: 10485760, MB: 10240, GB: 10 };
    const stepMap = { KB: 10, MB: 0.1, GB: 0.01 };
    targetValue.max = String(maxMap[next] || 10485760);
    targetValue.step = String(stepMap[next] || 10);
    if (bytes != null) {
      const converted = bytes / unitToBytes(next);
      targetValue.value = String(Number(converted.toFixed(next === "KB" ? 0 : next === "MB" ? 3 : 6)));
    }
    scheduleCompress();
  }

  function getTargetBytes() {
    const raw = Number(targetValue.value);
    const val = Number.isFinite(raw) && raw > 0 ? raw : 500;
    return Math.round(val * unitToBytes(sizeUnit));
  }

  function formatTargetLabel(bytes) {
    return formatBytes(bytes);
  }

  function clamp(n, lo, hi) {
    return Math.min(hi, Math.max(lo, n));
  }

  function revokeAll() {
    if (srcUrl) { URL.revokeObjectURL(srcUrl); srcUrl = null; }
    if (outUrl) { URL.revokeObjectURL(outUrl); outUrl = null; }
  }

  function setPreview(root, imgSrc, name, info) {
    const thumb = root.querySelector(".thumb");
    const nameEl = root.querySelector(".name");
    const infoEl = root.querySelector(".info");
    thumb.innerHTML = "";
    if (imgSrc) {
      const img = document.createElement("img");
      img.src = imgSrc;
      img.alt = name || "预览";
      thumb.appendChild(img);
    } else {
      const span = document.createElement("span");
      span.className = "empty";
      span.textContent = "等待中";
      thumb.appendChild(span);
    }
    nameEl.textContent = name || "—";
    infoEl.textContent = info || "—";
  }

  function updateLabels() {
    qualityVal.textContent = quality.value + "%";
  }

  function setFmt(next) {
    fmt = next;
    document.querySelectorAll("[data-fmt]").forEach((btn) => {
      btn.setAttribute("aria-pressed", String(btn.getAttribute("data-fmt") === next));
    });
    pngNote.hidden = fmt !== "image/png";
    scheduleCompress();
  }

  function setMode(next) {
    mode = next;
    document.querySelectorAll("[data-mode]").forEach((btn) => {
      btn.setAttribute("aria-pressed", String(btn.getAttribute("data-mode") === next));
    });
    qualityRow.hidden = next !== "quality";
    targetRow.hidden = next !== "target";
    compressBtn.textContent = next === "target" ? "按目标导出" : "导出";
    scheduleCompress();
  }

  function outputExt() {
    return extByMime[fmt] || "bin";
  }

  function outputName(base) {
    return `${base || "image"}.${outputExt()}`;
  }

  function getOutputDims() {
    const w = clamp(Math.round(Number(outW.value) || srcW || 1920), 1, MAX_DIM);
    const h = clamp(Math.round(Number(outH.value) || srcH || 1080), 1, MAX_DIM);
    return { w, h };
  }

  function syncFromWidth() {
    if (ignoreDimInput || !srcW || !srcH || !lockAspect.checked) return;
    ignoreDimInput = true;
    const w = clamp(Math.round(Number(outW.value) || srcW), 1, MAX_DIM);
    outW.value = String(w);
    outH.value = String(Math.max(1, Math.round(w * (srcH / srcW))));
    ignoreDimInput = false;
  }

  function syncFromHeight() {
    if (ignoreDimInput || !srcW || !srcH || !lockAspect.checked) return;
    ignoreDimInput = true;
    const h = clamp(Math.round(Number(outH.value) || srcH), 1, MAX_DIM);
    outH.value = String(h);
    outW.value = String(Math.max(1, Math.round(h * (srcW / srcH))));
    ignoreDimInput = false;
  }

  async function decodeImage(file) {
    if (typeof createImageBitmap === "function") {
      try {
        return await createImageBitmap(file);
      } catch { /* fall through */ }
    }
    return await new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(url);
        resolve(img);
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        reject(new Error("无法解码该图片"));
      };
      img.src = url;
    });
  }

  function makeCanvas(w, h, src) {
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, w);
    canvas.height = Math.max(1, h);
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(src, 0, 0, canvas.width, canvas.height);
    return canvas;
  }

  function canvasToBlob(canvas, type, q) {
    return new Promise((resolve, reject) => {
      if (canvas.toBlob) {
        canvas.toBlob((blob) => {
          if (blob) resolve(blob);
          else reject(new Error("导出失败"));
        }, type, q);
      } else {
        try {
          const dataUrl = canvas.toDataURL(type, q);
          const bin = atob(dataUrl.split(",")[1]);
          const arr = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
          resolve(new Blob([arr], { type }));
        } catch (e) {
          reject(e);
        }
      }
    });
  }

  async function normalizeWebp(blob) {
    if (
      fmt === "image/webp" &&
      blob &&
      blob.type &&
      blob.type !== "image/webp" &&
      blob.size > 0
    ) {
      setFmt("image/jpeg");
      throw new Error("当前浏览器不支持 WebP 导出，已回退为 JPG，请重新导出");
    }
    return blob;
  }

  async function encodeOnce(w, h, q) {
    const canvas = makeCanvas(w, h, srcBitmap);
    let blob = await canvasToBlob(canvas, fmt, q);
    blob = await normalizeWebp(blob);
    return blob;
  }

  async function fitTargetSize(w, h, targetBytes) {
    const isPng = fmt === "image/png";
    let curW = clamp(w, 16, MAX_DIM);
    let curH = clamp(h, 16, MAX_DIM);
    let attempts = 0;
    let best = null;
    const maxAttempts = 10;

    while (attempts < maxAttempts) {
      attempts++;
      let blob;
      let usedQ = 1;

      if (isPng) {
        blob = await encodeOnce(curW, curH, 1);
      } else {
        // Prefer close size first; allow q up to 1.0 so large targets can grow.
        let lo = 0.1;
        let hi = 1;
        let localBest = null;
        for (let i = 0; i < 8; i++) {
          const mid = (lo + hi) / 2;
          const b = await encodeOnce(curW, curH, mid);
          if (!localBest || Math.abs(b.size - targetBytes) < Math.abs(localBest.blob.size - targetBytes)) {
            localBest = { blob: b, q: mid };
          }
          if (b.size > targetBytes) hi = mid;
          else lo = mid;
        }
        // also probe max quality once — critical when target is large
        const maxB = await encodeOnce(curW, curH, 1);
        if (!localBest || Math.abs(maxB.size - targetBytes) < Math.abs(localBest.blob.size - targetBytes)) {
          localBest = { blob: maxB, q: 1 };
        }
        blob = localBest.blob;
        usedQ = localBest.q;
      }

      if (!best || Math.abs(blob.size - targetBytes) < Math.abs(best.blob.size - targetBytes)) {
        best = { blob, w: curW, h: curH, q: usedQ };
      }

      // good enough (~±8%)
      if (blob.size <= targetBytes * 1.08 && blob.size >= targetBytes * 0.92) {
        break;
      }

      if (blob.size > targetBytes * 1.08) {
        const nextW = Math.max(16, Math.round(curW * 0.8));
        const nextH = Math.max(16, Math.round(curH * 0.8));
        if (nextW === curW && nextH === curH) break;
        curW = nextW;
        curH = nextH;
      } else {
        // still smaller than target — enlarge pixels (and thus file size)
        const nextW = Math.min(MAX_DIM, Math.max(curW + 1, Math.round(curW * 1.25)));
        const nextH = Math.min(MAX_DIM, Math.max(curH + 1, Math.round(curH * 1.25)));
        if (nextW === curW && nextH === curH) {
          // already at max dim; if still under target, report best effort
          break;
        }
        curW = nextW;
        curH = nextH;
      }
    }

    return best;
  }

  function setStrategy(next) {
    targetStrategy = next;
    document.querySelectorAll("[data-strategy]").forEach((btn) => {
      btn.setAttribute("aria-pressed", String(btn.getAttribute("data-strategy") === next));
    });
    scheduleCompress();
  }

  function crc32(bytes) {
    let c = 0xffffffff;
    for (let i = 0; i < bytes.length; i++) {
      c ^= bytes[i];
      for (let k = 0; k < 8; k++) {
        c = (c >>> 1) ^ (0xedb88320 & -(c & 1));
      }
    }
    return (c ^ 0xffffffff) >>> 0;
  }

  function writeUint32BE(arr, offset, value) {
    arr[offset] = (value >>> 24) & 0xff;
    arr[offset + 1] = (value >>> 16) & 0xff;
    arr[offset + 2] = (value >>> 8) & 0xff;
    arr[offset + 3] = value & 0xff;
  }

  function writeUint32LE(arr, offset, value) {
    arr[offset] = value & 0xff;
    arr[offset + 1] = (value >>> 8) & 0xff;
    arr[offset + 2] = (value >>> 16) & 0xff;
    arr[offset + 3] = (value >>> 24) & 0xff;
  }

  /** Pad JPEG with COM markers right after SOI so pixels stay identical. */
  function padJpegBytes(bytes, targetBytes) {
    if (bytes.length >= targetBytes) return bytes;
    if (!(bytes[0] === 0xff && bytes[1] === 0xd8)) return bytes;

    let need = targetBytes - bytes.length;
    const coms = [];
    // Each COM: FF FE + len(2, includes len bytes) + data
    // max data per COM = 65533 - 2? len field max 65535, data = len - 2, marker 2 bytes total overhead 4
    while (need > 0) {
      const overhead = 4; // marker + length
      const maxData = 65533; // len = data + 2 <= 65535 → data <= 65533
      let dataLen = Math.min(maxData, need - overhead);
      if (dataLen < 1) {
        // need is tiny (1–3): cannot form a valid COM; leave undershoot
        break;
      }
      const total = overhead + dataLen;
      if (total > need) {
        dataLen = need - overhead;
        if (dataLen < 1) break;
      }
      const chunk = new Uint8Array(4 + dataLen);
      chunk[0] = 0xff;
      chunk[1] = 0xfe;
      const len = dataLen + 2;
      chunk[2] = (len >> 8) & 0xff;
      chunk[3] = len & 0xff;
      // fill with 'X' pattern — ignored by decoders
      chunk.fill(0x58, 4);
      coms.push(chunk);
      need -= 4 + dataLen;
    }
    if (!coms.length) return bytes;

    const totalPad = coms.reduce((s, c) => s + c.length, 0);
    const out = new Uint8Array(bytes.length + totalPad);
    // SOI + COMs + rest of jpeg
    out.set(bytes.subarray(0, 2), 0);
    let off = 2;
    for (const c of coms) {
      out.set(c, off);
      off += c.length;
    }
    out.set(bytes.subarray(2), off);
    return out;
  }

  /** Pad PNG with a private ancillary chunk before IEND. */
  function padPngBytes(bytes, targetBytes) {
    if (bytes.length >= targetBytes) return bytes;
    // PNG signature
    const sig = [0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a];
    for (let i = 0; i < 8; i++) {
      if (bytes[i] !== sig[i]) return bytes;
    }
    // find IEND
    let iendAt = -1;
    for (let i = 8; i + 12 <= bytes.length; i++) {
      if (
        bytes[i + 4] === 0x49 && bytes[i + 5] === 0x45 &&
        bytes[i + 6] === 0x4e && bytes[i + 7] === 0x44
      ) {
        iendAt = i;
        break;
      }
    }
    if (iendAt < 0) return bytes;

    let need = targetBytes - bytes.length;
    const chunks = [];
    // private ancillary: type "prVt" (lowercase first = ancillary)
    while (need > 0) {
      // chunk: len(4)+type(4)+data+crc(4) = 12 + data
      const overhead = 12;
      let dataLen = Math.min(0x7fffffff, need - overhead);
      if (dataLen < 0) break;
      if (dataLen === 0 && need >= overhead) dataLen = 0;
      if (need < overhead) break;
      const total = overhead + dataLen;
      const chunk = new Uint8Array(total);
      writeUint32BE(chunk, 0, dataLen);
      chunk[4] = 0x70; // p
      chunk[5] = 0x72; // r
      chunk[6] = 0x56; // V
      chunk[7] = 0x74; // t
      if (dataLen > 0) chunk.fill(0x20, 8, 8 + dataLen);
      const crcBytes = chunk.subarray(4, 8 + dataLen);
      writeUint32BE(chunk, 8 + dataLen, crc32(crcBytes));
      chunks.push(chunk);
      need -= total;
      if (dataLen === 0) break;
    }
    if (!chunks.length) return bytes;
    const padSize = chunks.reduce((s, c) => s + c.length, 0);
    const out = new Uint8Array(bytes.length + padSize);
    out.set(bytes.subarray(0, iendAt), 0);
    let off = iendAt;
    for (const c of chunks) {
      out.set(c, off);
      off += c.length;
    }
    out.set(bytes.subarray(iendAt), off);
    return out;
  }

  /** Pad WebP by inserting a private RIFF chunk before end. */
  function padWebpBytes(bytes, targetBytes) {
    if (bytes.length >= targetBytes) return bytes;
    // RIFF....WEBP
    if (
      bytes.length < 12 ||
      bytes[0] !== 0x52 || bytes[1] !== 0x49 ||
      bytes[2] !== 0x46 || bytes[3] !== 0x46 ||
      bytes[8] !== 0x57 || bytes[9] !== 0x45 ||
      bytes[10] !== 0x42 || bytes[11] !== 0x50
    ) return bytes;

    let need = targetBytes - bytes.length;
    const chunks = [];
    while (need > 0) {
      // chunk: fourcc(4)+size(4)+data+pad to even
      const overhead = 8;
      let dataLen = need - overhead;
      if (dataLen < 1) break;
      // RIFF chunks padded to even
      if (dataLen % 2 === 1) dataLen -= 1;
      if (dataLen < 1) break;
      const paddedLen = dataLen + (dataLen % 2);
      const total = 8 + paddedLen;
      if (total > need) {
        dataLen -= 2;
        if (dataLen < 1) break;
      }
      const actualTotal = 8 + dataLen + (dataLen % 2);
      if (actualTotal > need) break;
      const chunk = new Uint8Array(actualTotal);
      chunk[0] = 0x58; // X
      chunk[1] = 0x50; // P
      chunk[2] = 0x41; // A
      chunk[3] = 0x44; // D
      writeUint32LE(chunk, 4, dataLen);
      chunk.fill(0x00, 8);
      chunks.push(chunk);
      need -= actualTotal;
    }
    if (!chunks.length) return bytes;

    const padSize = chunks.reduce((s, c) => s + c.length, 0);
    const out = new Uint8Array(bytes.length + padSize);
    out.set(bytes, 0);
    let off = bytes.length;
    for (const c of chunks) {
      out.set(c, off);
      off += c.length;
    }
    // fix RIFF size field (bytes 4-7, LE): new file size - 8
    const riffSize = out.length - 8;
    writeUint32LE(out, 4, riffSize);
    return out;
  }

  function padBlobToBytes(blob, targetBytes) {
    if (!blob || blob.size >= targetBytes) return Promise.resolve(blob);
    return blob.arrayBuffer().then((buf) => {
      let bytes = new Uint8Array(buf);
      const type = blob.type || fmt;
      if (type === "image/jpeg" || type === "image/jpg") {
        bytes = padJpegBytes(bytes, targetBytes);
      } else if (type === "image/png") {
        bytes = padPngBytes(bytes, targetBytes);
      } else if (type === "image/webp") {
        bytes = padWebpBytes(bytes, targetBytes);
      } else {
        return blob;
      }
      if (bytes.length === blob.size) return blob;
      return new Blob([bytes], { type: blob.type || type });
    });
  }

  async function encodeBestAtDims(w, h, targetBytes) {
    // Binary search quality; if still under target, pad metadata (pixels unchanged).
    let lo = 0.2;
    let hi = 1;
    let best = null;
    for (let i = 0; i < 8; i++) {
      const mid = (lo + hi) / 2;
      const b = await encodeOnce(w, h, mid);
      if (!best || Math.abs(b.size - targetBytes) < Math.abs(best.blob.size - targetBytes)) {
        best = { blob: b, q: mid };
      }
      if (b.size > targetBytes) hi = mid;
      else lo = mid;
    }
    const maxB = await encodeOnce(w, h, 1);
    if (!best || Math.abs(maxB.size - targetBytes) < Math.abs(best.blob.size - targetBytes)) {
      best = { blob: maxB, q: 1 };
    }

    // Prefer not exceeding target when padding is possible
    let chosen = best;
    if (best.blob.size < targetBytes) {
      // try slightly lower quality to stay under, then pad up
      const lower = await encodeOnce(w, h, Math.max(0.25, best.q * 0.9));
      if (lower.size <= targetBytes) {
        chosen = { blob: lower, q: Math.max(0.25, best.q * 0.9) };
      } else if (best.blob.size <= targetBytes) {
        chosen = best;
      } else {
        // both over — keep closest (best)
        chosen = best;
      }
    }

    if (chosen.blob.size < targetBytes) {
      const padded = await padBlobToBytes(chosen.blob, targetBytes);
      return {
        blob: padded,
        q: chosen.q,
        padded: padded.size !== chosen.blob.size && padded.size >= targetBytes - 4,
      };
    }
    return { blob: chosen.blob, q: chosen.q, padded: false };
  }

  async function runCompress({ download } = { download: false }) {
    if (!srcFile || !srcBitmap || busy) return;
    busy = true;
    compressBtn.disabled = true;
    setStatus(mode === "target" ? "正在按目标大小计算…" : "正在处理…");

    try {
      const dims = getOutputDims();
      let blob;
      let usedW = dims.w;
      let usedH = dims.h;
      let usedQ = Number(quality.value) / 100;
      let note = "";

      if (mode === "target") {
        const targetBytes = getTargetBytes();
        if (targetBytes < 1024) throw new Error("目标大小至少 1 KB");

        if (targetStrategy === "pad") {
          // Keep current dimensions; fill size with metadata if needed
          const res = await encodeBestAtDims(dims.w, dims.h, targetBytes);
          blob = res.blob;
          usedW = dims.w;
          usedH = dims.h;
          usedQ = res.q;
          const targetLabel = formatTargetLabel(targetBytes);
          if (blob.size >= targetBytes - 8 && blob.size <= targetBytes + 32) {
            note = res.padded
              ? `画面未改尺寸，已补齐到 ${targetLabel}`
              : `已达到 ${targetLabel}`;
          } else if (blob.size < targetBytes) {
            note = `当前格式无法再填充：实际 ${formatBytes(blob.size)} / 目标 ${targetLabel}`;
          } else {
            note = `质量已最低仍超目标：实际 ${formatBytes(blob.size)} / 目标 ${targetLabel}`;
          }
          note += ` · ${usedW}×${usedH} · 质量 ${Math.round(usedQ * 100)}%`;
        } else {
          const best = await fitTargetSize(dims.w, dims.h, targetBytes);
          if (!best || !best.blob) throw new Error("未能生成有效结果");
          blob = best.blob;
          usedW = best.w;
          usedH = best.h;
          usedQ = best.q;
          const ratio = Math.abs(blob.size - targetBytes) / targetBytes;
          const targetLabel = formatTargetLabel(targetBytes);
          if (ratio <= 0.12) {
            note = `已接近目标 ${targetLabel}（实际 ${formatBytes(blob.size)}）`;
          } else if (blob.size < targetBytes) {
            note = `已尽量放大，仍小于目标：实际 ${formatBytes(blob.size)} / 目标 ${targetLabel}`;
          } else {
            note = `已尽量缩小，仍大于目标：实际 ${formatBytes(blob.size)} / 目标 ${targetLabel}`;
          }
          if (usedW !== dims.w || usedH !== dims.h) {
            note += ` · ${usedW}×${usedH}`;
          }
        }
      } else {
        blob = await encodeOnce(dims.w, dims.h, usedQ);
        note = `${usedW}×${usedH}，质量 ${Math.round(usedQ * 100)}%`;
      }

      if (!blob || blob.size === 0) throw new Error("输出结果为空");

      if (outUrl) URL.revokeObjectURL(outUrl);
      outUrl = URL.createObjectURL(blob);
      outBlob = blob;
      lastResult = { blob, w: usedW, h: usedH, q: usedQ };

      const base = (srcFile.name || "image").replace(/\.[^.]+$/, "");
      const outName = outputName(base);

      setPreview(
        previewOut,
        outUrl,
        outName,
        `${usedW}×${usedH} · ${formatBytes(blob.size)}`
      );

      const delta = srcFile.size > 0 ? (blob.size / srcFile.size - 1) * 100 : 0;
      statOrig.textContent = formatBytes(srcFile.size);
      statOut.textContent = formatBytes(blob.size);
      if (delta < 0) {
        statSave.textContent = `−${Math.abs(delta).toFixed(1)}%`;
        statSave.className = "v good";
      } else if (delta > 0) {
        statSave.textContent = `+${delta.toFixed(1)}%`;
        statSave.className = "v bad";
      } else {
        statSave.textContent = "0%";
        statSave.className = "v";
      }
      stats.hidden = false;

      if (download) {
        const a = document.createElement("a");
        a.href = outUrl;
        a.download = outName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setStatus(`已下载 ${outName}（${note}）`, "ok");
      } else {
        setStatus(note, "ok");
      }
    } catch (e) {
      setStatus(e && e.message ? e.message : "处理失败", "err");
    } finally {
      busy = false;
      compressBtn.disabled = !srcFile;
      resetBtn.disabled = !srcFile;
    }
  }

  function scheduleCompress() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => { runCompress({ download: false }); }, 200);
  }

  async function loadFile(file) {
    if (!file || !file.type || file.type.indexOf("image/") !== 0) {
      setStatus("请选择图片文件", "err");
      return;
    }
    revokeAll();
    srcFile = file;
    outBlob = null;
    lastResult = null;
    srcUrl = URL.createObjectURL(file);
    stats.hidden = true;
    compressBtn.disabled = true;
    resetBtn.disabled = false;
    setStatus("正在解码图片…");

    try {
      const bmp = await decodeImage(file);
      srcBitmap = bmp;
      srcW = bmp.width || bmp.naturalWidth;
      srcH = bmp.height || bmp.naturalHeight;

      setPreview(
        previewOrig,
        srcUrl,
        file.name || "image",
        `${srcW}×${srcH} · ${formatBytes(file.size)}`
      );
      setPreview(previewOut, null, "输出", "等待处理");

      ignoreDimInput = true;
      outW.value = String(srcW);
      outH.value = String(srcH);
      outW.max = String(MAX_DIM);
      outH.max = String(MAX_DIM);
      ignoreDimInput = false;

      dimHint.textContent = `原图 ${srcW}×${srcH}。可改为更大尺寸放大，或更小尺寸缩小。`;
      updateLabels();
      compressBtn.disabled = false;
      await runCompress({ download: false });
    } catch (e) {
      setStatus(e && e.message ? e.message : "图片解码失败", "err");
      compressBtn.disabled = true;
    }
  }

  function resetAll() {
    clearTimeout(debounceTimer);
    revokeAll();
    srcFile = null;
    srcBitmap = null;
    outBlob = null;
    lastResult = null;
    srcW = 0;
    srcH = 0;
    fileInput.value = "";
    stats.hidden = true;
    compressBtn.disabled = true;
    resetBtn.disabled = true;
    qualityRow.hidden = false;
    targetRow.hidden = true;
    setMode("quality");
    previewOrig.querySelector(".thumb").innerHTML = '<span class="empty">原图</span>';
    previewOut.querySelector(".thumb").innerHTML = '<span class="empty">输出</span>';
    previewOrig.querySelector(".name").textContent = "—";
    previewOrig.querySelector(".info").textContent = "—";
    previewOut.querySelector(".name").textContent = "—";
    previewOut.querySelector(".info").textContent = "—";
    dimHint.textContent = "可大于原图实现放大；设回原尺寸则不缩放。";
    setStatus("已清空，可重新选择图片。");
  }

  function pickFiles() { fileInput.click(); }

  drop.addEventListener("click", pickFiles);
  drop.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      pickFiles();
    }
  });
  fileInput.addEventListener("change", () => {
    const f = fileInput.files && fileInput.files[0];
    if (f) loadFile(f);
  });

  ["dragenter", "dragover"].forEach((ev) => {
    drop.addEventListener(ev, (e) => {
      e.preventDefault();
      e.stopPropagation();
      drop.classList.add("dragover");
    });
  });
  ["dragleave", "drop"].forEach((ev) => {
    drop.addEventListener(ev, (e) => {
      e.preventDefault();
      e.stopPropagation();
      drop.classList.remove("dragover");
    });
  });
  drop.addEventListener("drop", (e) => {
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) loadFile(f);
  });

  document.querySelectorAll("[data-fmt]").forEach((btn) => {
    btn.addEventListener("click", () => setFmt(btn.getAttribute("data-fmt")));
  });
  document.querySelectorAll("[data-mode]").forEach((btn) => {
    btn.addEventListener("click", () => setMode(btn.getAttribute("data-mode")));
  });

  quality.addEventListener("input", () => {
    updateLabels();
    scheduleCompress();
  });
  targetValue.addEventListener("input", scheduleCompress);
  document.querySelectorAll("[data-unit]").forEach((btn) => {
    btn.addEventListener("click", () => setUnit(btn.getAttribute("data-unit")));
  });
  document.querySelectorAll("[data-strategy]").forEach((btn) => {
    btn.addEventListener("click", () => setStrategy(btn.getAttribute("data-strategy")));
  });
  outW.addEventListener("input", () => {
    syncFromWidth();
    scheduleCompress();
  });
  outH.addEventListener("input", () => {
    syncFromHeight();
    scheduleCompress();
  });
  lockAspect.addEventListener("change", () => {
    if (lockAspect.checked) syncFromWidth();
    scheduleCompress();
  });

  compressBtn.addEventListener("click", () => runCompress({ download: true }));
  resetBtn.addEventListener("click", resetAll);

  window.addEventListener("beforeunload", revokeAll);

  updateLabels();
  setMode("quality");
  setFmt("image/jpeg");
})();
</script>
</body>
</html>
